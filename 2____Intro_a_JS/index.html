<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Generador de Password</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="contenedor">
    <h1>Generador de Password</h1>

    <!-- Donde se muestra la contraseña generada -->
    <div class="resultado">
      <input type="text" id="password-output" readonly>
      <button id="copiar-btn">Copiar</button>
    </div>

    <!-- Tamaño de la contraseña -->
    <div class="opcion">
      <label for="length-input">Tamaño de la contraseña</label>
      <input type="number" id="length-input" min="4" max="50" value="20">
    </div>

    <!-- Checkboxes de características -->
    <div class="opcion">
      <label for="mayusculas">Se incluyen letras mayúsculas</label>
      <input type="checkbox" id="mayusculas">
    </div>

    <div class="opcion">
      <label for="minusculas">Se incluye letras minúsculas</label>
      <input type="checkbox" id="minusculas" checked>
    </div>

    <div class="opcion">
      <label for="numeros">Se incluye números</label>
      <input type="checkbox" id="numeros">
    </div>

    <div class="opcion">
      <label for="simbolos">Se incluye símbolos</label>
      <input type="checkbox" id="simbolos" checked>
    </div>

    <button id="generar-btn">Generate Password</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
